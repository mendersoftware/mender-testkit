include:
  - project: Northern.tech/Mender/mendertesting
    file:
      - qa-common/runner.yml        # default runner tags
      - qa-common/retry.yml         # .qa-common-network-git-clone-retry
  - project: "Northern.tech/Mender/mendertesting"
    file:
      - ".gitlab-ci-check-commits.yml"           # -> test:check-commits
      - ".gitlab-ci-check-commits-signoffs.yml"  # -> sign-off enforcement
      - ".gitlab-ci-check-license.yml"           # -> test:check-license*
      - ".gitlab-ci-check-python3-format.yml"    # -> test:check-python3-formatting
      - ".gitlab-ci-github-status-updates.yml"   # -> github:start/success/failure (.pre/.post)
  - component: gitlab.com/Northern.tech/Mender/mendertesting/renovate@master
    inputs:
      stage: "renovate"

variables:
  LICENSE_HEADERS_IGNORE_FILES_REGEXP: '\./src/mender_testkit/testutils/.*'

default:
  tags: !reference [.qa-common-default-runner, tags]
  retry: !reference [.qa-common-default-retry, retry]

stages:
  - test
  - renovate

test:vendored-trees:
  stage: test
  needs: []
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git
    - !reference [.qa-common-network-git-clone-retry, before_script]
  script:
    - python3 scripts/vendor.py --check

